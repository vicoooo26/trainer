  - update
- apiGroups:
  - kubeflow.org
  resources:
  - pytorchjobs/status
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - tfjobs
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - kubeflow.org
  resources:
  - tfjobs/finalizers
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - tfjobs/status
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - xgboostjobs
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - kubeflow.org
  resources:
  - xgboostjobs/finalizers
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - xgboostjobs/status
  verbs:
  - update
{{- if not .Values.mpiDisableRBACManagement }}
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - create
  - list
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - list
  - watch
{{- end }}
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - podgroups
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - scheduling.x-k8s.io
  resources:
  - podgroups
  verbs:
