- apiGroups:
  - kubeflow.org
  resources:
  - mpijobs
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - kubeflow.org
  resources:
  - mpijobs/finalizers
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - mpijobs/status
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - paddlejobs
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - kubeflow.org
  resources:
  - paddlejobs/finalizers
  verbs:
  - update
- apiGroups:
  - kubeflow.org
  resources:
  - paddlejobs/status
  verbs:
