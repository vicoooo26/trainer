apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "training-operator.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "training-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: "{{ .Values.testImage.repository }}:{{ .Values.testImage.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ['wget']
      args: ['{{ include "training-operator.fullname" . }}:{{ .Values.service.metricsPort }}/metrics']
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  restartPolicy: Never
